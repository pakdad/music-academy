<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/shared/app.css">
<script src="/shared/edition.js"></script>
<script src="/shared/i18n-de.js"></script>
<script src="/shared/i18n.js"></script>
<title>Metronome</title>
</head>
<body>
<div id="app"></div>
<script src="/shared/theory.js"></script>
<script src="/shared/audio.js"></script>
<script src="/shared/input.js"></script>
<script src="/shared/keyboard.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/transport.js"></script>
<script src="/shared/mic.js"></script>
<script src="/shared/toolbox.js"></script>
<script>
// Metronome and timing: a metronome, plus a check of how close to the beat you play (any key, MIDI or
// on-screen, or tap). Silent bars train the pulse inside you; calibration measures this setup's delay.
(() => {
  const { h } = UI;
  const page = UI.page({ drill: 'metronome', title: t('Metronome & timing'), hud: false, tools: ['midi', 'keyboard'], keyboard: { lo: 48, hi: 72, sound: false }, onSettings() {} });
  const stage = page.el.prompt.parentElement;
  stage.className = 'stage';
  stage.innerHTML = '';

  const S = Object.assign({ bpm: 80, time: '4/4', sub: 1, accent: true, gap: 'off' }, UI.store.get('metronome', {}));
  const save = () => UI.store.set('metronome', S);
  const TIMES = { '2/4': [2, 1], '3/4': [3, 1], '4/4': [4, 1], '5/4': [5, 1], '6/8': [2, 3] }; // [beats, steps per beat forced]
  const GAPS = { off: null, '2-2': [2, 2], '1-1': [1, 1], '3-1': [3, 1], '4-4': [4, 4] };

  // ---------- controls ----------
  const bpmOut = h('div', { class: 'bpm' });
  const slider = h('input', { type: 'range', min: 30, max: 240, value: S.bpm, oninput: e => setBpm(+e.target.value) });
  const dots = h('div', { class: 'beats' });
  const startBtn = h('button', { class: 'btn primary big', onclick: () => run ? stopRun() : startRun() }, UI.ilabel('play', t('Start')));
  const gapLabel = h('div', { class: 'gap-label' });
  const seg = (options, get, set) => {
    const el = h('div', { class: 'seg' });
    const draw = () => { el.innerHTML = ''; for (const [v, label] of options) el.append(h('button', { class: v === get() ? 'on' : '', onclick: () => { set(v); save(); draw(); restart(); } }, label)); };
    draw();
    return el;
  };
  function setBpm(v) {
    S.bpm = Math.max(30, Math.min(240, Math.round(v)));
    slider.value = S.bpm;
    bpmOut.innerHTML = `${S.bpm}<small>${S.time === '6/8' ? t('dotted quarters per minute') : t('beats per minute')}</small>`;
    save();
    clearTimeout(setBpm.t);
    setBpm.t = setTimeout(restart, 250);
  }
  let taps = [];
  function tapTempo() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length >= 3) {
      const iv = taps.slice(-5).map((t, i, a) => i ? t - a[i - 1] : null).filter(Boolean);
      setBpm(60000 / (iv.reduce((a, b) => a + b, 0) / iv.length));
    }
  }

  // ---------- timing check ----------
  const last = h('div', { class: 'last-hit' }, '–');
  const strip = h('div', { class: 'strip' }, h('div', { class: 'strip-mid' }), h('div', { class: 'strip-band' }));
  const statsEl = h('div', { class: 'tstats muted' });
  const pad = h('button', { class: 'pad', onpointerdown: e => { e.preventDefault(); hit(e.timeStamp || performance.now()); } }, t('Tap on the beat'));
  const calOut = h('span', { class: 'muted' });
  const calBtn = h('button', { class: 'btn', onclick: () => calibrate() }, t('Measure my delay'));
  // the microphone as input: clap, strum, play an acoustic instrument (it has its own delay, measured separately)
  const micToggle = h('label', { class: 'tgl' }, h('input', { type: 'checkbox', onchange: e => { if (e.target.checked) Mic.start(); else Mic.stop(); showCal(); } }), t('Listen with the microphone'));
  Mic.on('onset', o => hit(o.time + 0, 'mic'));
  Mic.on('state', s => { micToggle.querySelector('input').checked = s === 'on'; });
  let hits = [];

  stage.append(
    h('div', { class: 'metro card' },
      h('div', { class: 'bpm-row' },
        h('button', { class: 'btn round', onclick: () => setBpm(S.bpm - 1) }, '−'), bpmOut,
        h('button', { class: 'btn round', onclick: () => setBpm(S.bpm + 1) }, '+')),
      slider,
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: tapTempo }, t('Tap tempo')), startBtn),
      dots, gapLabel,
      h('div', { class: 'ctl' }, h('span', {}, t('Time signature')), seg(Object.keys(TIMES).map(x => [x, x]), () => S.time, v => { S.time = v; setBpm(S.bpm); })),
      h('div', { class: 'ctl' }, h('span', {}, t('Clicks')), seg([[1, t('Beats')], [2, t('Eighths')], [3, t('Triplets')], [4, t('Sixteenths')]], () => S.sub, v => { S.sub = v; })),
      h('div', { class: 'ctl' }, h('span', {}, t('Accent')), seg([[true, t('First beat')], [false, t('None')]], () => S.accent, v => { S.accent = v; })),
      h('div', { class: 'ctl' }, h('span', {}, t('Silent bars')), seg([['off', t('Off')], ['2-2', t('{a} on, {b} off', { a: 2, b: 2 })], ['1-1', t('{a} on, {b} off', { a: 1, b: 1 })], ['3-1', t('{a} on, {b} off', { a: 3, b: 1 })], ['4-4', t('{a} on, {b} off', { a: 4, b: 4 })]], () => S.gap, v => { S.gap = v; })),
      h('p', { class: 'hint' }, t('Silent bars: the click stops, you keep going. Your timing is still measured, so you see whether the pulse is yours or the metronome\'s.'))),
    h('div', { class: 'timing card' },
      h('h3', {}, t('How close to the beat?')),
      h('p', { class: 'muted' }, t('Play any key on the beat (MIDI or on-screen), tap the pad, or press J. In “Eighths” and finer, every click counts.')),
      last, strip, statsEl, pad,
      h('div', { class: 'row cal' }, micToggle, calBtn, calOut)));
  setBpm(S.bpm);
  showCal();

  // ---------- running ----------
  let run = null;
  function grid() {
    const [beats, forced] = TIMES[S.time];
    return { beats, steps: forced > 1 ? forced : S.sub };
  }
  function silentBar(bar) {
    const g = GAPS[S.gap];
    if (!g || bar < 0) return false;
    return bar % (g[0] + g[1]) >= g[0];
  }
  function startRun(opts = {}) {
    stopRun();
    const { beats, steps } = grid();
    const bpm = opts.bpm || S.bpm;
    const triple = S.time === '6/8';
    const tr = Transport.create({
      bpm, stepsPerBeat: steps,
      onStep: (s, time) => {
        const bar = Math.floor(s / (beats * steps));
        if (!opts.calibrate && silentBar(bar)) return;
        const onBeat = s % steps === 0;
        const first = s % (beats * steps) === 0;
        if (!onBeat && !triple && S.sub === 1) return;
        if (!onBeat && triple && S.sub === 1) { Sound.click(time, 0, 0.6); return; } // 6/8: the eighths, softly
        Sound.click(time, first && S.accent ? 2 : onBeat ? 1 : 0);
      },
    });
    run = { tr, beats, steps, calibrate: opts.calibrate, raw: [] };
    dots.innerHTML = '';
    for (let i = 0; i < beats; i++) dots.append(h('span', { class: i === 0 && S.accent ? 'first' : '' }));
    tr.start();
    startBtn.replaceChildren(UI.ilabel('stop', t('Stop')));
    const loop = () => {
      if (!run) return;
      const b = tr.beatNow();
      const bar = Math.floor(b / beats);
      const silent = !run.calibrate && silentBar(bar);
      [...dots.children].forEach((d, i) => d.classList.toggle('on', b >= 0 && !silent && Math.floor(b) % beats === i && b - Math.floor(b) < 0.3));
      gapLabel.textContent = silent ? t('silent bar: keep the beat') : '';
      dots.classList.toggle('silent', silent);
      run.raf = requestAnimationFrame(loop);
    };
    run.raf = requestAnimationFrame(loop);
  }
  function stopRun() {
    if (!run) return;
    run.tr.stop();
    cancelAnimationFrame(run.raf);
    run = null;
    startBtn.replaceChildren(UI.ilabel('play', t('Start')));
    gapLabel.textContent = '';
    dots.classList.remove('silent');
    [...dots.children].forEach(d => d.classList.remove('on'));
  }
  function restart() { if (run && !run.calibrate) startRun(); }

  // a hit, at a time on the performance.now() clock
  function hit(time, source) {
    if (!run) return;
    const raw = run.tr.beatOfPerf(time);
    if (raw < -0.25) return;
    const pos = (run.calibrate || source === 'mic' ? raw : run.tr.beatOfPerf(time - (UI.prefs.latency || 0))) * run.steps;
    const off = (pos - Math.round(pos)) / run.steps * run.tr.msPerBeat;
    if (run.calibrate) return calHit(off);
    hits.push(off);
    hits = hits.slice(-40);
    draw(off);
  }
  function draw(off) {
    const range = 150;
    const word = Math.abs(off) <= 10 ? t('spot on') : off > 0 ? t('late') : t('early');
    last.innerHTML = `${off > 0 ? '+' : off < 0 ? '−' : ''}${Math.abs(Math.round(off))} ms <small>${word}</small>`;
    last.className = 'last-hit ' + (Math.abs(off) <= 25 ? 'good' : Math.abs(off) <= 60 ? 'ok' : 'bad');
    [...strip.querySelectorAll('.hit')].forEach((d, i, all) => { d.style.opacity = Math.max(0.12, 1 - (all.length - i) * 0.06); });
    const d = h('span', { class: 'hit' });
    d.style.left = `${50 + Math.max(-1, Math.min(1, off / range)) * 50}%`;
    strip.append(d);
    while (strip.querySelectorAll('.hit').length > 24) strip.querySelector('.hit').remove();
    const n = hits.length, mean = hits.reduce((a, b) => a + b, 0) / n;
    const sd = n > 1 ? Math.sqrt(hits.reduce((a, o) => a + (o - mean) ** 2, 0) / (n - 1)) : 0;
    const tight = hits.filter(o => Math.abs(o) <= 25).length;
    statsEl.textContent = t('Last {n}: average {avg} ms ({lean}) · spread ±{sd} ms · {p} % within ±25 ms', { n, avg: (mean >= 0 ? '+' : '−') + Math.abs(Math.round(mean)), lean: Math.abs(mean) < 10 ? t('centred') : mean > 0 ? t('dragging') : t('rushing'), sd: Math.round(sd), p: Math.round(tight / n * 100) });
  }

  // ---------- calibration: the delay between what you hear and when your notes arrive ----------
  function showCal() { calOut.textContent = Mic.state === 'on' ? t('Microphone delay correction: {n} ms', { n: Math.round(UI.prefs.micLatency || 0) }) : t('Delay correction: {n} ms', { n: Math.round(UI.prefs.latency || 0) }); }
  function calibrate() {
    hits = []; strip.querySelectorAll('.hit').forEach(d => d.remove());
    startRun({ calibrate: true, bpm: 90 });
    run.raw = [];
    calOut.textContent = t('Play a key exactly with each click, 16 times…');
  }
  function calHit(off) {
    run.raw.push(off);
    calOut.textContent = t('Play a key exactly with each click: {n} of 16', { n: run.raw.length });
    if (run.raw.length < 16) return;
    const sorted = run.raw.slice(4).sort((a, b) => a - b); // the first few are settling in
    const median = sorted[Math.floor(sorted.length / 2)];
    stopRun();
    // the microphone's times already have its old correction taken off: add what is left over
    if (Mic.state === 'on') UI.setPref('micLatency', Math.max(-50, Math.min(300, (UI.prefs.micLatency || 0) + median)));
    else UI.setPref('latency', Math.max(-50, Math.min(250, median)));
    showCal();
    calOut.textContent += ' ' + t('(saved; it applies to “Play along” in the pieces too)');
  }

  Input.on(e => { if (e.type === 'on') hit(e.time); });
  addEventListener('keydown', e => {
    if (e.target.closest?.('dialog, input')) return;
    if (e.code === 'Space') { e.preventDefault(); run && !run.calibrate ? stopRun() : startRun(); }
    else if (e.code === 'KeyJ' || e.code === 'KeyF' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) hit(e.timeStamp || performance.now()); }
    else if (e.code === 'ArrowUp') setBpm(S.bpm + (e.shiftKey ? 5 : 1));
    else if (e.code === 'ArrowDown') setBpm(S.bpm - (e.shiftKey ? 5 : 1));
    else if (e.code === 'KeyT') tapTempo();
  });
  self.__state = () => ({ run, hits, S });
})();
</script>
</body>
</html>
