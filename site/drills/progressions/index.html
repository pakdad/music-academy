<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/shared/app.css">
<script src="/shared/edition.js"></script>
<script src="/shared/i18n-de.js"></script>
<script src="/shared/i18n.js"></script>
<title>Progressions</title>
</head>
<body>
<div id="app"></div>
<script src="/shared/theory.js"></script>
<script src="/shared/glyphs.js"></script>
<script src="/shared/staff.js"></script>
<script src="/shared/audio.js"></script>
<script src="/shared/input.js"></script>
<script src="/shared/keyboard.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/chordinput.js"></script>
<script>
// Progressions: the first look at a new piece. Read the key from the signature and the chords, then
// name each bar's harmony as a Roman numeral. Or hear a progression and recognise it, or play one
// in any key. Items: "key:<fifths><M|m>", "rn:<M|m>:<numeral>", "hear:<id>", "play:<M|m>:<numeral>".
(() => {
  const T = Theory;
  const GOOD = '#2f7d4f', BAD = '#be123c';
  const SPEC = [
    { id: 'mode', label: t('Drill'), type: 'choice', options: [['read', t('Read it: key and chords')], ['hear', t('Hear it: which progression?')], ['play', t('Play it in a key')]] },
    { id: 'tonality', label: t('Keys'), type: 'choice', options: [['major', t('Major')], ['minor', t('Minor')], ['both', t('Both')]] },
    { id: 'maxKey', label: t('Signatures'), type: 'number', min: 0, max: 7, format: v => v ? t('up to {n} ♯ or ♭', { n: v }) : t('C major / A minor only') },
  ];
  const DEFAULTS = { mode: 'read', tonality: 'major', maxKey: 3 };

  const page = UI.page({
    drill: 'progressions', title: t('Progressions'), settings: SPEC, defaults: DEFAULTS,
    describe: item => {
      const p = item.split(':');
      if (p[0] === 'key') return t('Finding the key: {key}', { key: UI.keyName({ fifths: parseInt(p[1]), minor: p[1].endsWith('m') }) });
      if (p[0] === 'hear') return t('Hearing {chords}', { chords: T.PROGRESSIONS.find(x => x.id === p[1]).chords.join('–') });
      return `${p[2]} ${p[1] === 'm' ? t('in minor') : t('in major')}${p[0] === 'play' ? ' (' + t('playing') + ')' : ''}`;
    },
    onSettings: () => start(), keyboard: { lo: 36, hi: 84 },
  });

  let S, q = null, wait = false, playing = [];
  const chordIn = ChordInput.create({ onResult: playResult });

  function start() { S = page.settings; next(); }

  function modes() { return S.tonality === 'both' ? [false, true] : [S.tonality === 'minor']; }
  function randomKey(minor) {
    const keys = [];
    for (let f = -S.maxKey; f <= S.maxKey; f++) keys.push(`key:${f}${minor ? 'm' : 'M'}`);
    const item = page.pick(keys, { target: 4000 });
    return { fifths: parseInt(item.split(':')[1]), minor };
  }
  function build(key, prog) {
    const chords = T.voice(prog.chords.map(n => T.romanChord(key, n)));
    return chords.map(c => ({ ...c, name: UI.chordName(c.root, c.type) }));
  }

  function stopSound() { playing.forEach(clearTimeout); playing = []; }

  function next() {
    stopSound();
    chordIn.stop();
    page.clearFlash(); page.kb.clear(); page.clearChoices();
    wait = false;
    const minor = UI.rand(modes());
    const pool = T.PROGRESSIONS.filter(p => p.minor === minor);
    if (S.mode === 'hear') {
      const item = page.pick(pool.map(p => 'hear:' + p.id), { target: 6000, avoid: q ? [q.item] : [] });
      const prog = pool.find(p => 'hear:' + p.id === item);
      const key = randomKey(minor);
      q = { item, prog, key, chords: build(key, prog), missed: false };
      return askHear(pool);
    }
    const prog = UI.rand(pool);
    const key = randomKey(minor);
    q = { prog, key, chords: build(key, prog), bar: -1, missed: false };
    if (S.mode === 'play') return askPlay(0);
    askKey();
  }

  // ---------- read: the key, then each bar ----------
  function draw({ labels = false, colors = [] } = {}) {
    page.el.card.innerHTML = Staff.svg({
      clef: 'grand', key: q.key.fifths, barlines: true, spacing: 10, ledgers: 2,
      items: q.chords.map((c, i) => ({
        notes: [{ ...c.bass, staff: 'bass' }, ...c.upper.map(n => ({ ...n, staff: 'treble' }))],
        color: colors[i], mark: i === q.bar,
        label: labels || i < q.bar ? c.name : '', sublabel: labels || i < q.bar ? c.numeral : '',
      })),
    });
  }

  function askKey() {
    q.bar = -1;
    q.stage = 'key';
    const item = `key:${q.key.fifths}${q.key.minor ? 'm' : 'M'}`;
    q.item = item;
    draw();
    page.el.prompt.innerHTML = t('What key is this in?') + '<small>' + t('The signature gives two choices: the chords decide') + '</small>';
    const k = q.key;
    const cands = [
      { fifths: k.fifths, minor: !k.minor },                      // the relative key (same signature)
      { fifths: k.fifths + (k.minor ? 3 : -3), minor: !k.minor }, // the parallel key (same tonic)
      { fifths: k.fifths + 1, minor: k.minor },
      { fifths: k.fifths - 1, minor: k.minor },
      { fifths: k.fifths + 2, minor: k.minor },
    ].filter(c => Math.abs(c.fifths) <= 7);
    const opts = [{ label: UI.keyName(k), value: true }];
    for (const c of cands) if (opts.length < 6) opts.push({ label: UI.keyName(c), value: false });
    page.ask(item);
    q.missed = false;
    page.choices(UI.shuffle(opts), (ok, btn) => {
      if (wait) return;
      if (ok) {
        btn.classList.add('right');
        if (!q.missed) page.answer(true, { item });
        page.flash(true, UI.keyName(k));
        askBar(0);
      } else {
        btn.classList.add('wrong');
        if (!q.missed) page.answer(false, { item });
        q.missed = true;
        page.flash(false, keyTip(k));
      }
    }, { columns: 3 });
  }
  function keyTip(k) {
    const rel = UI.keyName({ fifths: k.fifths, minor: !k.minor });
    if (k.minor) {
      const lt = T.transpose(T.keyTonic(k.fifths, true), 6, 11);
      return t('It\'s <b>{key}</b>, not {rel}: the chords start and end on {tonic}', { key: UI.keyName(k), rel, tonic: UI.noteName(T.keyTonic(k.fifths, true)) }) +
        (q.prog.chords.includes('V') ? t(', and the {note} (raised 7th) gives the minor key away.', { note: UI.noteName(lt) }) : '.');
    }
    return t('It\'s <b>{key}</b>, not {rel}: the chords lean on {major} and there\'s no raised 7th of the minor.', { key: UI.keyName(k), rel, major: UI.keyName({ fifths: k.fifths, minor: false }) });
  }

  function askBar(i) {
    q.bar = i;
    q.stage = 'bar';
    q.missed = false;
    if (i > 0) page.clearFlash();
    const c = q.chords[i];
    const item = `rn:${q.key.minor ? 'm' : 'M'}:${c.numeral}`;
    q.item = item;
    draw();
    page.el.prompt.innerHTML = t('Bar {n}: which chord?', { n: i + 1 }) + `<small>${t('in {key}', { key: UI.keyName(q.key) })}</small>`;
    const numerals = T.diatonic(q.key);
    page.ask(item);
    page.choices(numerals.map(n => ({ label: n, value: n, sub: UI.chordName(T.romanChord(q.key, n).root, T.romanChord(q.key, n).type) })), (n, btn) => {
      if (wait) return;
      if (n === c.numeral) {
        btn.classList.add('right');
        if (!q.missed) page.answer(true, { item });
        if (i + 1 < q.chords.length) { setTimeout(() => askBar(i + 1), 250); return; }
        finishRead();
      } else {
        btn.classList.add('wrong');
        if (!q.missed) page.answer(false, { item });
        q.missed = true;
        page.flash(false, t('It\'s <b>{numeral}</b>: {chord} ({notes})', { numeral: c.numeral, chord: c.name, notes: c.notes.map(n => UI.noteName(n)).join(' – ') }));
      }
    }, { columns: numerals.length > 7 ? 5 : 7 });
    // hide the chord names under the buttons: they'd give it away. Shown after answering.
    page.el.answers.querySelectorAll('.choice-sub').forEach(s => s.style.visibility = 'hidden');
  }

  function finishRead() {
    wait = true;
    q.bar = -1;
    draw({ labels: true });
    page.clearChoices();
    page.el.prompt.innerHTML = `${UI.keyName(q.key)}: ${q.prog.chords.join(' – ')}<small>${t(q.prog.name)}</small>`;
    page.flash(true, '');
    const row = UI.h('div', { class: 'row' },
      UI.h('button', { class: 'btn', onclick: () => listen() }, '▶ ' + t('Listen')),
      UI.h('button', { class: 'btn primary', onclick: () => next() }, t('Next') + ' ›'));
    page.el.answers.append(row);
    listen();
  }

  // play the chords and light up each bar as it sounds
  function listen(show = true) {
    stopSound();
    const gap = 1.15;
    Sound.sequence(q.chords.map(c => [T.midi(c.bass), ...c.upper.map(T.midi)]), { gap, dur: 1.05 });
    if (!show) return;
    q.chords.forEach((_, i) => playing.push(setTimeout(() => { q.bar = i; draw({ labels: true }); }, i * gap * 1000 + 20)));
    playing.push(setTimeout(() => { q.bar = -1; draw({ labels: true }); }, q.chords.length * gap * 1000));
  }

  // ---------- hear ----------
  function askHear(pool) {
    page.el.card.innerHTML = '';
    page.el.prompt.innerHTML = t('Which progression is this?') + '<small>' + t('Hear where it rests and where it pulls') + '</small>';
    page.el.prompt.append(UI.h('div', { class: 'row', style: 'margin-top:10px' }, UI.h('button', { class: 'btn', onclick: () => listen(false) }, '▶ ' + t('Play again'))));
    const others = UI.shuffle(pool.filter(p => p.id !== q.prog.id)).slice(0, 3);
    const opts = UI.shuffle([q.prog, ...others]).map(p => ({ label: p.chords.join(' – '), sub: t(p.name), value: p.id }));
    page.ask(q.item);
    page.choices(opts, (id, btn) => {
      if (wait) return;
      if (id === q.prog.id) {
        btn.classList.add('right');
        if (!q.missed) page.answer(true);
        wait = true;
        page.flash(true, `${q.prog.chords.join(' – ')} · ${UI.keyName(q.key)}`);
        draw({ labels: true });
        page.el.answers.append(UI.h('div', { class: 'row' }, UI.h('button', { class: 'btn primary', onclick: () => next() }, t('Next') + ' ›')));
      } else {
        btn.classList.add('wrong');
        if (!q.missed) page.answer(false);
        q.missed = true;
        page.flash(false, t('Not that one. Listen again: is the first chord home? Where does it land?'));
      }
    }, { columns: 2 });
    setTimeout(() => listen(false), 300);
  }

  // ---------- play ----------
  function askPlay(i) {
    q.bar = i;
    const c = q.chords[i];
    q.item = `play:${q.key.minor ? 'm' : 'M'}:${c.numeral}`;
    q.missed = false;
    const chips = q.chords.map((x, j) => `<span style="${j === i ? 'color:var(--accent);text-decoration:underline' : j < i ? 'color:var(--good)' : ''}">${x.numeral}</span>`).join(' – ');
    page.el.prompt.innerHTML = t('In <b>{key}</b>, play {chips}', { key: UI.keyName(q.key), chips }) + `<small>${t('any voicing, any octave')}</small>`;
    page.el.card.innerHTML = '';
    page.ask(q.item);
    chordIn.expect(c.notes.map(T.midi));
  }
  function playResult(r) {
    if (!q || S.mode !== 'play' || wait) return;
    const c = q.chords[q.bar];
    if (!r.ok) {
      for (const m of r.wrongNotes || []) page.kb.mark(m, 'bad');
      if (!q.missed) page.answer(false);
      q.missed = true;
      c.notes.forEach(n => page.kb.mark(T.midi(n) + 12, 'hint'));
      page.flash(false, t('{numeral} in {key} is <b>{chord}</b>: {notes}', { numeral: c.numeral, key: UI.keyName(q.key), chord: c.name, notes: c.notes.map(n => UI.noteName(n)).join(' – ') }));
      return;
    }
    if (!q.missed) page.answer(true);
    page.clearFlash();
    page.kb.clear();
    if (q.bar + 1 < q.chords.length) return askPlay(q.bar + 1);
    wait = true;
    q.bar = -1;
    draw({ labels: true });
    page.el.prompt.innerHTML = `${UI.keyName(q.key)}: ${q.prog.chords.join(' – ')}<small>${t(q.prog.name)}</small>`;
    page.flash(true, t('Done. Here it is written out.'));
    page.el.answers.append(UI.h('div', { class: 'row' },
      UI.h('button', { class: 'btn', onclick: () => listen() }, '▶ ' + t('Listen')),
      UI.h('button', { class: 'btn primary', onclick: () => next() }, t('Next') + ' ›')));
  }

  // Enter / space = next, when a round is finished
  addEventListener('keydown', e => { if (wait && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('dialog')) { e.preventDefault(); next(); } });

  self.__state = () => q; // for the end-to-end test
  start();
})();
</script>
</body>
</html>
