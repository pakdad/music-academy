<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/shared/app.css">
<script src="/shared/edition.js"></script>
<script src="/shared/i18n-de.js"></script>
<script src="/shared/i18n.js"></script>
<title>Pieces</title>
</head>
<body>
<div id="app"></div>
<script src="/shared/theory.js"></script>
<script src="/shared/glyphs.js"></script>
<script src="/shared/staff.js"></script>
<script src="/shared/score.js"></script>
<script src="/shared/pieces.js"></script>
<script src="/shared/audio.js"></script>
<script src="/shared/input.js"></script>
<script src="/shared/keyboard.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/transport.js"></script>
<script src="/shared/importer.js"></script>
<script>
// Pieces: real music with rhythm. Three ways to play one:
//   Wait for me   the score waits until you play the right notes (learn the notes first)
//   Play along    metronome and count-in; every note is judged for pitch and timing
//   Listen        hear it, with the playhead following the score
// Practise one hand and let the other one play by itself, or play both.
(() => {
  const T = Theory;
  const { h } = UI;
  const page = UI.page({ drill: 'pieces', title: t('Pieces'), hud: false, tools: ['midi', 'sound', 'keyboard'], keyboard: { lo: 36, hi: 84 }, onSettings() {} });
  const stage = page.el.prompt.parentElement;
  const HANDS = { rh: t('Right hand'), lh: t('Left hand'), both: t('Both hands') };
  const LEVELS = { 1: t('Level 1 · one hand'), 2: t('Level 2 · both hands, simple'), 3: t('Level 3 · both hands, more going on') };

  const prefsKey = 'pieces:settings';
  const settings = Object.assign({ mode: 'wait', metronome: true, accomp: true, fingering: false }, UI.store.get(prefsKey, {}));
  const saveSettings = () => UI.store.set(prefsKey, settings);
  const pieceSettings = p => Object.assign({ bpm: p.tempo, hands: p.rh && p.lh ? 'both' : p.rh ? 'rh' : 'lh' }, UI.store.get('pieces:piece:' + p.id, {}));
  const best = () => UI.store.get('pieces:best', {});
  // pieces the user imported (MIDI or MusicXML), kept on this device
  const mine = () => UI.store.get('mypieces', []);
  const allPieces = () => [...PIECES, ...mine()];

  const keyName = p => UI.keyName({ fifths: p.key || 0, minor: !!p.minor });
  const handsOf = p => p.rh && p.lh ? t('both hands') : p.rh ? t('right hand') : t('left hand');

  // ---------- the library ----------
  function library() {
    stop();
    document.title = `${t('Pieces')} · ${(self.EDITION || {}).name || 'Music Academy'}`;
    stage.className = 'stage wide';
    stage.innerHTML = '';
    const b = best();
    stage.append(h('div', { class: 'lib-intro' },
      h('h2', {}, t('Pieces')),
      h('p', { class: 'muted' }, t('Short pieces to read and play. Start with “Wait for me” to learn the notes, then “Play along” with the metronome, slow at first.')),
      h('p', { class: 'muted' }, t('The classics are public domain; for the full original scores, each links to IMSLP, the Petrucci Music Library. Finger numbers can be switched on in every piece.'))));
    // my pieces, and importing new ones
    stage.append(h('h3', { class: 'lib-level' }, t('My pieces')));
    const fileIn = h('input', { type: 'file', accept: '.mid,.midi,.musicxml,.xml,.mxl,.pdf', hidden: true, onchange: e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); } });
    stage.append(h('div', { class: 'lib-grid' },
      mine().map(p => card(p, b)),
      h('button', { class: 'pcard import', onclick: () => fileIn.click() },
        h('div', { class: 'pcard-title' }, '＋ ' + t('Import a piece')),
        h('p', {}, t('From IMSLP: open the work\'s page, download its MIDI file (or a MusicXML file, e.g. from MuseScore), then load it here. You can then play it like any piece here.')),
        h('p', { class: 'muted' }, t('PDF scores are pictures of the music and can\'t be read as notes.'))),
      fileIn));
    for (const level of [1, 2, 3]) {
      const ps = PIECES.filter(p => p.level === level);
      if (!ps.length) continue;
      stage.append(h('h3', { class: 'lib-level' }, LEVELS[level]));
      stage.append(h('div', { class: 'lib-grid' }, ps.map(p => card(p, b))));
    }
  }
  function card(p, b) {
    const scores = Object.entries(b).filter(([k]) => k.startsWith(p.id + ':')).map(([, v]) => v.score);
    return h('a', { class: 'pcard', href: '#' + p.id },
      h('div', { class: 'pcard-title' }, tr(p, 'title')),
      h('div', { class: 'pcard-by' }, tr(p, 'by') || (p.mine ? t('Imported from {file}', { file: p.source || '' }) : '')),
      h('div', { class: 'pcard-meta' }, `${keyName(p)} · ${p.time.join('/')} · ${handsOf(p)} · ♩ = ${p.tempo}`),
      p.mine ? null : h('p', {}, tr(p, 'about')),
      h('div', { class: 'pcard-best' }, scores.length ? t('Best: {n} %', { n: Math.max(...scores) }) : ''));
  }

  // ---------- importing ----------
  const ERRORS = {
    pdf: () => t('That\'s a PDF: a picture of the music, which can\'t be read as notes. On IMSLP, look for a MIDI file of the same work (or a MusicXML file, e.g. from MuseScore).'),
    'not-midi': () => t('This is not a MIDI file the importer can read.'),
    smpte: () => t('This MIDI file counts time in frames (SMPTE), not in beats; it can\'t be turned into notes.'),
    'not-zip': () => t('This compressed MusicXML (.mxl) file can\'t be opened.'),
    'not-musicxml': () => t('This is not a MusicXML file the importer can read.'),
    timewise: () => t('This MusicXML file is stored "timewise"; export it again as normal (partwise) MusicXML.'),
    'no-notes': () => t('No notes found in this file.'),
    unknown: () => t('Unknown file type. Use a MIDI file (.mid) or MusicXML (.musicxml, .xml, .mxl).'),
  };
  const WARN = {
    meter: () => t('The time signature changes; everything is shown in the first one.'),
    key: () => t('The key changes; the first key signature is used and the rest is written with accidentals.'),
    parts: () => t('Several instruments: only the piano part was used.'),
    chords: () => t('Very full chords were thinned to six notes per hand.'),
    long: () => t('Long piece: only the first 300 bars were imported.'),
    time: () => t('Unusual time signature: shown in 4/4.'),
  };
  async function importFile(file) {
    let r;
    try { r = await Importer.fromFile(file); }
    catch (e) { alert(e.user && ERRORS[e.message] ? ERRORS[e.message]() : t('The file could not be imported:') + ' ' + e.message); return; }
    const { piece, report } = r;
    const titleIn = h('input', { type: 'text', value: piece.title, class: 'text' });
    const byIn = h('input', { type: 'text', value: piece.by, class: 'text', placeholder: t('Composer') });
    let preview;
    try { preview = Score.layout(piece, { width: 70 }).svg; } catch (e) { preview = ''; }
    const lines = [
      t('{n} notes in {b} bars, {hands}', { n: report.notes, b: report.bars, hands: handsOf(piece) }),
      `${keyName(piece)} · ${piece.time.join('/')} · ♩ = ${piece.tempo}`,
      report.offGrid ? t('{n} notes moved to the nearest sixteenth (triplets, grace notes, free timing).', { n: report.offGrid }) : '',
      report.simplified ? t('{n} long or tied notes end at the bar line or the next note.', { n: report.simplified }) : '',
      ...report.warnings.map(w => WARN[w] ? WARN[w]() : w),
    ].filter(Boolean);
    const dlg = h('dialog', { class: 'sheet' });
    dlg.append(h('h2', {}, t('Import a piece')),
      h('div', { class: 'sheet-body' },
        h('div', { class: 'field' }, h('div', { class: 'field-label' }, t('Title')), titleIn),
        h('div', { class: 'field' }, h('div', { class: 'field-label' }, t('Composer')), byIn),
        h('ul', { class: 'report' }, lines.map(l => h('li', {}, l))),
        h('div', { class: 'card score-card preview', html: preview })),
      h('div', { class: 'sheet-actions' },
        h('button', { class: 'btn ghost', onclick: () => dlg.close() }, t('Cancel')),
        h('button', { class: 'btn primary', onclick: () => {
          piece.title = titleIn.value.trim() || piece.title;
          piece.by = byIn.value.trim();
          const list = mine(); list.push(piece);
          try { UI.store.set('mypieces', list); } catch (e) { alert(t('Not enough space on this device to keep the piece.')); return; }
          dlg.close();
          location.hash = '#' + piece.id;
        } }, t('Add to my pieces'))));
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg);
    dlg.showModal();
  }
  function downloadMidi() {
    const blob = new Blob([Importer.toMidi(P)], { type: 'audio/midi' });
    const a = h('a', { href: URL.createObjectURL(blob), download: (tr(P, 'title') || 'piece').replace(/[^\w\-äöüÄÖÜß ]+/g, '').trim().replace(/ +/g, '_') + '.mid' });
    document.body.append(a); a.click(); a.remove();
  }

  // ---------- one piece ----------
  let P = null, PS = null, L = null, run = null;
  const els = {};

  function open(id) {
    stop();
    P = allPieces().find(p => p.id === id);
    if (!P) return library();
    PS = pieceSettings(P);
    if (!(P.rh && P.lh)) PS.hands = P.rh ? 'rh' : 'lh';
    document.title = `${tr(P, 'title')} · ${(self.EDITION || {}).name || 'Music Academy'}`;
    stage.className = 'stage wide';
    stage.innerHTML = '';
    els.status = h('div', { class: 'pstatus' });
    els.score = h('div', { class: 'card score-card' });
    els.result = h('div', { class: 'presult' });
    els.start = h('button', { class: 'btn primary big', onclick: () => run ? stop(true) : start() }, '▶ ' + t('Start'));
    els.tempoOut = h('span', { class: 'num' });
    const tempo = h('input', { type: 'range', min: 30, max: 200, value: PS.bpm, oninput: e => { PS.bpm = +e.target.value; tempoLabel(); savePiece(); } });
    const tempoLabel = () => { els.tempoOut.textContent = `♩ = ${PS.bpm}` + (PS.bpm !== P.tempo ? ` (${Math.round(PS.bpm / P.tempo * 100)} %)` : ''); };
    tempoLabel();
    const seg = (options, value, onPick) => {
      const el = h('div', { class: 'seg' });
      const draw = v => { el.innerHTML = ''; for (const [id, label] of options) el.append(h('button', { class: id === v ? 'on' : '', onclick: () => { if (run) stop(); onPick(id); draw(id); } }, label)); };
      draw(value);
      return el;
    };
    const toggle = (key, label, after) => h('label', { class: 'tgl' },
      h('input', { type: 'checkbox', checked: settings[key], onchange: e => { settings[key] = e.target.checked; saveSettings(); after && after(); } }), label);

    stage.append(
      h('div', { class: 'phead' },
        h('a', { class: 'back', href: '#' }, '‹ ' + t('All pieces')),
        h('h2', {}, tr(P, 'title')),
        h('div', { class: 'muted' }, tr(P, 'by')),
        h('div', { class: 'pcard-meta' }, `${keyName(P)} · ${P.time.join('/')} · ${handsOf(P)}`),
        h('p', { class: 'pabout' }, tr(P, 'about')),
        h('div', { class: 'plinks' },
          P.imslp ? h('a', { class: 'imslp', href: P.imslp, target: '_blank', rel: 'noopener' }, t('Full original score on IMSLP') + ' ↗') : null,
          h('button', { class: 'linkbtn', onclick: downloadMidi }, t('Download MIDI')),
          P.mine ? h('button', { class: 'linkbtn danger', onclick: () => {
            if (!confirm(t('Delete “{title}” from your pieces?', { title: P.title }))) return;
            UI.store.set('mypieces', mine().filter(p => p.id !== P.id));
            location.hash = '';
          } }, t('Delete')) : null),
        P.imslp ? h('p', { class: 'hint' }, t('IMSLP often has a MIDI file of the whole work: download it there and import it under “My pieces”.')) : null),
      h('div', { class: 'controls' },
        h('div', { class: 'ctl' }, h('span', {}, t('Mode')), seg([['wait', t('Wait for me')], ['play', t('Play along')], ['listen', t('Listen')]], settings.mode, v => { settings.mode = v; saveSettings(); refreshControls(); })),
        P.rh && P.lh ? h('div', { class: 'ctl' }, h('span', {}, t('Hands')), seg(Object.entries(HANDS), PS.hands, v => { PS.hands = v; savePiece(); render(); refreshControls(); })) : null,
        h('div', { class: 'ctl tempo' }, h('span', {}, t('Tempo')), tempo, els.tempoOut),
        els.toggles = h('div', { class: 'ctl toggles' }, /@/.test((P.rh || '') + (P.lh || '')) ? toggle('fingering', t('Finger numbers'), () => { if (!run) render(); }) : null, toggle('metronome', t('Metronome')),
          els.accomp = toggle('accomp', t('Play the other hand for me'))),
        h('div', { class: 'ctl go' }, els.start, els.status)),
      els.score, els.result);
    refreshControls();
    render();
    const all = [P.rh, P.lh].filter(Boolean).flatMap(v => Score.parseVoice(v, 'x').events.flatMap(e => e.notes.map(T.midi)));
    page.kb.setRange(Math.min(...all) - 2, Math.max(...all) + 2);
  }
  function savePiece() { UI.store.set('pieces:piece:' + P.id, { bpm: PS.bpm, hands: PS.hands }); }
  function refreshControls() {
    els.accomp.style.display = P.rh && P.lh && PS.hands !== 'both' && settings.mode !== 'listen' ? '' : 'none';
    els.status.textContent = { wait: t('Play each note when it lights up; the score waits for you.'), play: t('Count in, then play along. Every note is judged for pitch and timing.'), listen: t('Hear it played, with the playhead.') }[settings.mode];
  }

  function render() {
    const width = Math.max(44, Math.min(120, Math.round((els.score.clientWidth || 900) / 10.5)));
    L = Score.layout(P, { width, fingering: settings.fingering });
    els.score.innerHTML = L.svg;
    els.svg = els.score.querySelector('svg');
    els.ph = els.svg.querySelector('.playhead');
    els.ev = [...els.svg.querySelectorAll('.ev')].reduce((m, g) => (m[g.dataset.i] = g, m), {});
    for (const e of L.events) if (!practiced(e)) els.ev[e.i].classList.add('dim');
  }
  const practiced = e => PS.hands === 'both' || e.voice === PS.hands;
  const cls = (e, c) => { const g = els.ev[e.i]; g.classList.remove('cur', 'good', 'off', 'bad'); if (c) g.classList.add(c); };

  function playheadAt(t) {
    const m = L.marks;
    let i = 0;
    while (i + 1 < m.length && m[i + 1].t <= t) i++;
    const a = m[i], b = m[i + 1];
    let x = a.x;
    if (b && b.sys === a.sys && b.t > a.t) x = a.x + (b.x - a.x) * Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
    const box = L.systems[a.sys];
    els.ph.setAttribute('x', x - 8); els.ph.setAttribute('y', box.top); els.ph.setAttribute('height', box.bottom - box.top);
    els.ph.classList.add('on');
    if (run && run.sys !== a.sys) { run.sys = a.sys; els.ph.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }

  // ---------- running ----------
  function start() {
    if (run) stop();
    Sound.unlock();
    render();
    els.result.innerHTML = '';
    page.kb.clear();
    els.start.textContent = '■ ' + t('Stop');
    if (settings.mode === 'wait') startWait();
    else startTimed(settings.mode === 'listen');
  }
  function stop(byUser) {
    if (!run) return;
    run.tr && run.tr.stop();
    cancelAnimationFrame(run.raf);
    const r = run;
    run = null;
    if (els.start) els.start.textContent = '▶ ' + t('Start');
    if (els.ph) els.ph.classList.remove('on');
    if (byUser && r.mode !== 'listen') els.result.innerHTML = `<p class="muted">${t('Stopped. Start again when you are ready.')}</p>`;
  }

  // wait for me: the next notes light up; play them (any order, all of them), then it moves on
  function startWait() {
    const byT = new Map();
    for (const e of L.events) if (practiced(e) && !e.rest) (byT.get(e.t) || byT.set(e.t, []).get(e.t)).push(e);
    const steps = [...byT.entries()].sort((a, b) => a[0] - b[0]).map(([t, evs]) => ({ t, evs, need: new Set(evs.flatMap(e => e.midis)) }));
    run = { mode: 'wait', steps, i: 0, got: new Set(), wrong: 0, clean: 0, missed: false, t0: performance.now(), sys: -1 };
    show();
    function show() {
      const s = steps[run.i];
      s.evs.forEach(e => cls(e, 'cur'));
      playheadAt(s.t);
    }
    run.onNote = (m) => {
      const s = steps[run.i];
      if (s.need.has(m)) {
        run.got.add(m);
        if ([...s.need].every(x => run.got.has(x))) {
          s.evs.forEach(e => cls(e, run.missed ? 'off' : 'good'));
          if (!run.missed) run.clean++;
          // the other hand, up to the next step
          if (settings.accomp && PS.hands !== 'both') {
            const next = run.i + 1 < steps.length ? steps[run.i + 1].t : L.length;
            const spb = 60 / PS.bpm;
            for (const e of L.events) if (!practiced(e) && !e.rest && e.t >= s.t && e.t < next) Sound.chord(e.midis, { at: (e.t - s.t) * spb, dur: e.d * spb * 0.95, vel: 0.45 });
          }
          run.i++; run.got.clear(); run.missed = false; page.kb.clear();
          if (run.i >= steps.length) return finishWait();
          show();
        }
      } else {
        run.wrong++;
        run.missed = true;
        page.kb.mark(m, 'bad');
        s.need.forEach(x => page.kb.mark(x, 'hint'));
        s.evs.forEach(e => els.ev[e.i].classList.add('cur'));
      }
    };
  }
  function finishWait() {
    const r = run;
    const secs = (performance.now() - r.t0) / 1000;
    const score = Math.round(r.clean / r.steps.length * 100);
    stop();
    els.result.innerHTML = '';
    els.result.append(resultBox(score, [
      t('{a} of {b} steps without a slip', { a: r.clean, b: r.steps.length }),
      wrongNotes(r.wrong),
      t('{time} minutes', { time: `${Math.floor(secs / 60)}:${String(Math.round(secs % 60)).padStart(2, '0')}` }),
    ], score >= 90 ? t('Ready for “Play along”.') : t('Again, until it flows.')));
    saveBest('wait', score);
  }

  // play along / listen: the transport runs; notes are judged against the beat
  function startTimed(listen) {
    const [num, den] = P.time;
    // playing along: a bar to count in; with a pickup, the count-in runs on until the pickup's beat
    const countIn = listen ? 0 : L.pickup ? 2 * L.L - L.pickup : L.L;
    const steps = den === 8 ? 2 : 1;            // clicks on every eighth in 3/8 and 6/8, else every beat
    const beatEvery = den === 8 && num % 3 === 0 && num > 3 ? 1.5 : den === 8 ? L.L : 1;
    const tr = Transport.create({
      bpm: PS.bpm, stepsPerBeat: steps,
      onStep: (s, time) => {
        const q = s / steps - countIn;          // where in the piece, in quarter notes
        if (q >= L.length - 1e-9) return;
        if (q >= 0 && !settings.metronome) return;
        const inBar = (((q - L.pickup) % L.L) + L.L) % L.L;
        const level = inBar < 1e-6 || L.L - inBar < 1e-6 ? 2 : Math.abs(inBar / beatEvery - Math.round(inBar / beatEvery)) < 1e-6 ? 1 : 0;
        Sound.click(time, level, q < 0 ? 1 : 0.8);
      },
    });
    const spb = tr.spb;
    for (const e of L.events) {
      if (e.rest) continue;
      const mine = practiced(e);
      if (listen || (!mine && settings.accomp)) tr.at(e.t + countIn, time => Sound.chord(e.midis, { when: time, dur: e.d * spb * 0.93, vel: mine ? 0.6 : 0.45 }));
    }
    const expected = [];
    if (!listen) for (const e of L.events) if (practiced(e) && !e.rest) {
      e.judge = { n: e.midis.length, hit: 0, good: 0, miss: 0 };
      for (const m of e.midis) expected.push({ e, m, beat: e.t + countIn, done: false });
    }
    const msBeat = tr.msPerBeat;
    run = {
      mode: listen ? 'listen' : 'play', tr, countIn, expected, sys: -1,
      win: Math.min(300, Math.max(120, 0.45 * msBeat)), good: Math.max(45, 0.1 * msBeat), offsets: [], wrong: 0,
    };
    tr.start();
    const loop = () => {
      if (!run) return;
      const beat = tr.beatNow(), b = beat - countIn;
      if (b < 0) {
        els.status.innerHTML = `<span class="countin">${Math.floor(-b) + 1}</span>`;
        els.ph.classList.remove('on');
      } else {
        els.status.textContent = t('Bar {a} of {b}', { a: Math.min(L.bars, Math.floor(b / L.L) + 1), b: L.bars });
        playheadAt(b);
        if (listen) for (const e of L.events) if (!e.rest) {
          const on = b >= e.t && b < e.t + e.d;
          if (on !== els.ev[e.i].classList.contains('cur')) els.ev[e.i].classList.toggle('cur', on);
        }
      }
      // notes not played in time count as missed
      if (!listen) {
        const late = beat - run.win / msBeat;
        for (const x of expected) if (!x.done && x.beat < late) { x.done = true; x.e.judge.miss++; settle(x.e); }
      }
      if (b > L.length + 0.4) return listen ? (stop(), refreshControls()) : finishPlay();
      run.raf = requestAnimationFrame(loop);
    };
    run.raf = requestAnimationFrame(loop);
    run.onNote = (m, time) => {
      if (listen) return;
      const at = tr.beatOfPerf(time - (UI.prefs.latency || 0));
      let bestX = null;
      for (const x of expected) if (!x.done && x.m === m && Math.abs(at - x.beat) * msBeat <= run.win && (!bestX || Math.abs(at - x.beat) < Math.abs(at - bestX.beat))) bestX = x;
      if (!bestX) { run.wrong++; page.kb.mark(m, 'bad'); setTimeout(() => page.kb.clear(), 300); return; }
      bestX.done = true;
      const off = (at - bestX.beat) * msBeat;
      run.offsets.push(off);
      bestX.e.judge.hit++;
      if (Math.abs(off) <= run.good) bestX.e.judge.good++;
      settle(bestX.e);
    };
  }
  function settle(e) {
    const j = e.judge;
    if (j.hit + j.miss < j.n) return;
    cls(e, j.miss ? 'bad' : j.good === j.n ? 'good' : 'off');
  }
  function finishPlay() {
    const r = run;
    stop();
    const total = r.expected.length;
    const hit = r.offsets.length;
    const onTime = r.offsets.filter(o => Math.abs(o) <= r.good).length;
    const mean = hit ? r.offsets.reduce((a, b) => a + b, 0) / hit : 0;
    const sd = hit > 1 ? Math.sqrt(r.offsets.reduce((a, o) => a + (o - mean) ** 2, 0) / (hit - 1)) : 0;
    const score = Math.max(0, Math.round((onTime + 0.6 * (hit - onTime)) / total * 100 - r.wrong));
    const lean = Math.abs(mean) < 12 ? t('right on the beat') : mean > 0 ? t('{n} ms late on average (dragging)', { n: Math.round(mean) }) : t('{n} ms early on average (rushing)', { n: Math.round(-mean) });
    els.result.innerHTML = '';
    els.result.append(resultBox(score, [
      t('{a} of {b} notes played ({p} %)', { a: hit, b: total, p: Math.round(hit / total * 100) }),
      t('{n} on time (within ±{ms} ms)', { n: onTime, ms: Math.round(r.good) }),
      hit ? t('{lean}, spread ±{ms} ms', { lean, ms: Math.round(sd) }) : '',
      wrongNotes(r.wrong),
    ].filter(Boolean), advice(score, onTime === total && !r.wrong)));
    saveBest(`play@${PS.bpm}`, score);
  }
  function advice(score, clean) {
    const fast = PS.bpm >= P.tempo;
    if (clean) return fast ? t('Clean at full tempo. Next piece?') : t('Clean: try it a little faster.');
    if (score >= 90) return t('Very good, with a slip or two. Once more?');
    if (score >= 60) return t('Getting there: once more, or a little slower.');
    return t('Slow it down (tempo slider) or use “Wait for me” first.');
  }
  function resultBox(score, lines, advice) {
    return h('div', { class: 'card result-card' },
      h('div', { class: 'big-score' }, score + ' %'),
      h('ul', {}, lines.map(l => h('li', {}, l))),
      h('p', { class: 'advice' }, advice),
      h('button', { class: 'btn primary', onclick: () => start() }, '↻ ' + t('Again')));
  }
  function wrongNotes(n) { return n === 1 ? t('1 wrong note') : t('{n} wrong notes', { n }); }
  function saveBest(kind, score) {
    const b = best();
    const k = `${P.id}:${PS.hands}:${kind}`;
    if (!b[k] || b[k].score < score) { b[k] = { score, date: Date.now() }; UI.store.set('pieces:best', b); }
  }

  Input.on(e => { if (e.type === 'on' && run && run.onNote) run.onNote(e.midi, e.time); });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && P && location.hash && !e.target.closest?.('dialog, input')) { e.preventDefault(); run ? stop(true) : start(); }
  });
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (P && !run && location.hash) render(); }, 200); });

  const route = () => { const id = decodeURIComponent(location.hash.slice(1)); id ? open(id) : (P = null, library()); };
  addEventListener('hashchange', route);
  self.__state = () => ({ run, L, P, PS }); // for the end-to-end test
  route();
})();
</script>
</body>
</html>
