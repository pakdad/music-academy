server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # relative redirects, so they work behind a reverse proxy
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Web MIDI and the microphone (for guitar, later) are only for this site itself
    add_header Permissions-Policy "midi=(self), microphone=(self), camera=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # pages, scripts, the service worker and data: always check for a newer version
    location ~* \.(html|js|json|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "midi=(self), microphone=(self), camera=(), geolocation=()" always;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
